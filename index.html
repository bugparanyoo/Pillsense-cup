<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pillsense Cup Dashboard</title>
    
    <!-- PWA Meta Tags สำหรับรองรับการ Add to Home Screen -->
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-cyan-400">Pillsense Cup</h1>
            <button id="connectBtn" onclick="toggleBLEConnection()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-cyan-900/50">
                Connect BLE
            </button>
        </div>

        <!-- Connection Status -->
        <div id="statusBadge" class="mb-6 p-3 bg-slate-900/60 rounded-xl border border-slate-700 flex items-center justify-between">
            <span class="text-sm text-slate-400">สถานะการเชื่อมต่อ:</span>
            <span id="connectionText" class="text-sm font-semibold text-rose-400">ยังไม่ได้เชื่อมต่อ</span>
        </div>

        <!-- Water Level Card -->
        <div class="bg-slate-900/80 rounded-xl p-4 mb-6 border border-slate-700">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm text-slate-300">ระดับน้ำในแก้ว</span>
                <span id="waterText" class="text-lg font-bold text-cyan-400">--%</span>
            </div>
            <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden">
                <div id="waterBar" class="bg-cyan-500 h-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <!-- Pill Slots Status -->
        <h2 class="text-sm font-semibold text-slate-400 mb-3">สถานะตลับยามื้อวันนี้</h2>
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div id="slotMorning" class="bg-slate-900/80 p-3 rounded-xl border border-slate-700 text-center">
                <div class="text-xs text-slate-400 mb-1">มื้อเช้า</div>
                <div id="statusMorningText" class="text-sm font-bold text-amber-400">รอทาน</div>
            </div>
            <div id="slotNoon" class="bg-slate-900/80 p-3 rounded-xl border border-slate-700 text-center">
                <div class="text-xs text-slate-400 mb-1">กลางวัน</div>
                <div id="statusNoonText" class="text-sm font-bold text-amber-400">รอทาน</div>
            </div>
            <div id="slotEvening" class="bg-slate-900/80 p-3 rounded-xl border border-slate-700 text-center">
                <div class="text-xs text-slate-400 mb-1">มื้อเย็น</div>
                <div id="statusEveningText" class="text-sm font-bold text-amber-400">รอทาน</div>
            </div>
        </div>

        <!-- Next Alarm Info -->
        <div class="bg-slate-900/80 rounded-xl p-4 mb-6 border border-slate-700 flex justify-between items-center">
            <span class="text-sm text-slate-300">แจ้งเตือนมื้อถัดไป:</span>
            <span id="nextAlarmText" class="text-base font-bold text-emerald-400">--:--</span>
        </div>

        <!-- Actions -->
        <div class="space-y-3">
            <button onclick="syncTime()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 py-2.5 rounded-xl text-sm font-medium transition">
                ซิงค์เวลาปัจจุบัน (Time Sync)
            </button>
            
            <div class="pt-2 border-t border-slate-700">
                <h2 class="text-xs font-semibold text-slate-400 mb-2">ตั้งเวลาแจ้งเตือนใหม่</h2>
                <div class="grid grid-cols-3 gap-2 mb-2">
                    <input type="time" id="timeMorning" value="08:00" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-center text-white">
                    <input type="time" id="timeNoon" value="12:30" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-center text-white">
                    <input type="time" id="timeEvening" value="19:00" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-center text-white">
                </div>
                <button onclick="updateSchedule()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-emerald-900/50">
                    บันทึกตารางเวลา (Save Schedule)
                </button>
            </div>
        </div>
    </div>

    <!-- Alert Modal สำหรับแจ้งเตือนบนหน้าแอป -->
    <div id="alertModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-800 border border-rose-500/50 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
            <div id="alertIcon" class="text-4xl mb-3">🚨</div>
            <h3 id="alertTitle" class="text-lg font-bold text-rose-400 mb-2">ถึงเวลาทานยาแล้ว!</h3>
            <p id="alertDesc" class="text-sm text-slate-300 mb-6">กรุณาหยิบยาตามช่องที่กำหนดและดื่มน้ำตาม</p>
            <button onclick="closeAppAlert()" class="w-full bg-rose-600 hover:bg-rose-500 text-white py-2.5 rounded-xl font-medium transition">
                รับทราบ / ปิดเสียง
            </button>
        </div>
    </div>

    <script>
        const SERVICE_UUID          = "42a70001-e29f-412f-a2e6-7b5c87c0e001";
        const TIME_SYNC_CHAR_UUID   = "42a70002-e29f-412f-a2e6-7b5c87c0e001";
        const TELEMETRY_CHAR_UUID   = "42a70003-e29f-412f-a2e6-7b5c87c0e001";
        const SCHEDULE_CHAR_UUID    = "42a70004-e29f-412f-a2e6-7b5c87c0e001";

        let bleDevice = null;
        let telemetryCharacteristic = null;
        let timeCharacteristic = null;
        let scheduleCharacteristic = null;
        let audioCtx = null;
        let alarmInterval = null;

        // ระบบเสียงแจ้งเตือนผ่านเบราว์เซอร์ (Web Audio API)
        function playWebAlertSound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (alarmInterval) return; // กำลังดังอยู่แล้วไม่ต้องสร้างซ้ำ

            alarmInterval = setInterval(() => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 880; // เสียงความถี่สูงแจ้งเตือน
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }, 600);
        }

        function stopWebAlertSound() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        function showAppAlert(title, desc, isWrong = false) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertDesc').innerText = desc;
            document.getElementById('alertIcon').innerText = isWrong ? '⚠️' : '🚨';
            document.getElementById('alertModal').classList.remove('hidden');
            playWebAlertSound();
        }

        function closeAppAlert() {
            document.getElementById('alertModal').classList.add('hidden');
            stopWebAlertSound();
        }

        async function toggleBLEConnection() {
            if (!bleDevice || !bleDevice.gatt.connected) {
                try {
                    bleDevice = await navigator.bluetooth.requestDevice({
                        filters: [{ name: 'Pillsense-Cup' }],
                        optionalServices: [SERVICE_UUID]
                    });

                    bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
                    const server = await bleDevice.gatt.connect();
                    const service = await server.getPrimaryService(SERVICE_UUID);

                    telemetryCharacteristic = await service.getCharacteristic(TELEMETRY_CHAR_UUID);
                    timeCharacteristic = await service.getCharacteristic(TIME_SYNC_CHAR_UUID);
                    scheduleCharacteristic = await service.getCharacteristic(SCHEDULE_CHAR_UUID);

                    await telemetryCharacteristic.startNotifications();
                    telemetryCharacteristic.addEventListener('characteristicvaluechanged', handleTelemetryNotification);

                    document.getElementById('connectionText').innerText = 'เชื่อมต่อแล้ว (Connected)';
                    document.getElementById('connectionText').className = 'text-sm font-semibold text-emerald-400';
                    document.getElementById('connectBtn').innerText = 'Disconnect';
                    document.getElementById('connectBtn').className = 'bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-rose-900/50';

                    syncTime();
                } catch (error) {
                    console.error('BLE Connection failed: ', error);
                    alert('เชื่อมต่อบลูทูธไม่สำเร็จ: ' + error);
                }
            } else {
                if (bleDevice.gatt.connected) {
                    bleDevice.gatt.disconnect();
                }
            }
        }

        function onDisconnected() {
            document.getElementById('connectionText').innerText = 'ยังไม่ได้เชื่อมต่อ';
            document.getElementById('connectionText').className = 'text-sm font-semibold text-rose-400';
            document.getElementById('connectBtn').innerText = 'Connect BLE';
            document.getElementById('connectBtn').className = 'bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-cyan-900/50';
        }

        function handleTelemetryNotification(event) {
            const value = new TextDecoder().decode(event.target.value);
            // Payload format: H2O:%d|M:%d|N:%d|E:%d|Next:%02d:%02d
            let data = {};
            value.split('|').forEach(p => {
                let kv = p.split(':');
                data[kv[0]] = kv[1];
            });

            // Update Water
            let h2o = data['H2O'] || 0;
            document.getElementById('waterText').innerText = h2o + '%';
            document.getElementById('waterBar').style.width = h2o + '%';

            // Update Slots
            updateSlotUI('slotMorning', 'statusMorningText', data['M']);
            updateSlotUI('slotNoon', 'statusNoonText', data['N']);
            updateSlotUI('slotEvening', 'statusEveningText', data['E']);

            // Update Next Alarm & Trigger App Notification if time matches
            if (data['Next']) {
                document.getElementById('nextAlarmText').innerText = data['Next'];
                
                let now = new Date();
                let curTimeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
                
                if (curTimeStr === data['Next'] && !window.alertTriggeredMin) {
                    showAppAlert("ถึงเวลาทานยาแล้ว!", "กรุณาหยิบยาจากตลับ Pillsense Cup ทันที");
                    window.alertTriggeredMin = curTimeStr;
                } else if (curTimeStr !== data['Next']) {
                    window.alertTriggeredMin = null;
                }
            }
        }

        function updateSlotUI(cardId, textId, statusVal) {
            let card = document.getElementById(cardId);
            let text = document.getElementById(textId);
            if (statusVal === '1') {
                card.className = "bg-emerald-950/40 p-3 rounded-xl border border-emerald-600/50 text-center";
                text.innerText = "ทานแล้ว";
                text.className = "text-sm font-bold text-emerald-400";
            } else {
                card.className = "bg-slate-900/80 p-3 rounded-xl border border-slate-700 text-center";
                text.innerText = "รอทาน";
                text.className = "text-sm font-bold text-amber-400";
            }
        }

        async function syncTime() {
            if (!timeCharacteristic) return;
            try {
                const timestamp = Math.floor(Date.now() / 1000);
                const buffer = new ArrayBuffer(4);
                new DataView(buffer).setUint32(0, timestamp, true);
                await timeCharacteristic.writeValue(buffer);
            } catch (error) {
                console.error('Time sync failed: ', error);
            }
        }

        async function updateSchedule() {
            if (!scheduleCharacteristic) {
                alert('ยังไม่ได้เชื่อมต่อบลูทูธ');
                return;
            }
            try {
                let mArr = document.getElementById('timeMorning').value.split(':');
                let nArr = document.getElementById('timeNoon').value.split(':');
                let eArr = document.getElementById('timeEvening').value.split(':');

                let buffer = new Uint8Array([
                    parseInt(mArr[0]), parseInt(mArr[1]),
                    parseInt(nArr[0]), parseInt(nArr[1]),
                    parseInt(eArr[0]), parseInt(eArr[1])
                ]);

                await scheduleCharacteristic.writeValue(buffer);
                alert('บันทึกตารางเวลาสำเร็จ!');
            } catch (error) {
                console.error('Schedule update failed: ', error);
            }
        }

        // ลงทะเบียน Service Worker เพื่อรองรับ PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                console.log('Service Worker Registered');
            });
        }
    </script>
</body>
</html>
